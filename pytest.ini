[pytest]
testpaths = tests

# -n auto      : one worker per CPU core (pytest-xdist)
# --dist loadfile : keep every test of a file on the same worker, so tests that
#                   share module/class state inside one file keep their order
# Override with `-n0` for a serial run when debugging.
addopts = -q -n auto --dist loadfile

markers =
    slow: long-running test, excluded by `-m "not slow"`
